<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="GymFlow icon">
  <title>GymFlow</title>
  <defs>
    <linearGradient id="gf-icon-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399" />
      <stop offset="1" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Left weight plate -->
  <rect x="4" y="20" width="7" height="24" rx="3.5" fill="url(#gf-icon-grad)" />
  <rect x="13" y="14" width="9" height="36" rx="4.5" fill="url(#gf-icon-grad)" />

  <!-- Right weight plate -->
  <rect x="53" y="20" width="7" height="24" rx="3.5" fill="url(#gf-icon-grad)" />
  <rect x="42" y="14" width="9" height="36" rx="4.5" fill="url(#gf-icon-grad)" />

  <!-- Bar flowing into a pulse / wave line -->
  <path
    d="M22 32 H27 L30.5 22.5 L35 41.5 L38.5 32 H42"
    fill="none"
    stroke="url(#gf-icon-grad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
